<!DOCTYPE html>
<html>
<head>
    <title>StructuralLab Studio M10</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: #f0f0f0; overflow: hidden; }
        #design-pane { flex: 1; padding: 15px; display: flex; flex-direction: column; min-width: 0; }
        .group-box { flex: 1; border: 1px solid #999; background: white; position: relative; display: flex; align-items: center; justify-content: center; overflow: auto; }
        .label { position: absolute; top: -10px; left: 10px; background: #f0f0f0; padding: 0 5px; font-weight: bold; font-size: 0.85em; z-index: 10; }
        #sidebar { width: 420px; padding: 15px; border-left: 1px solid #ccc; display: flex; flex-direction: column; gap: 15px; background: #eee; }
        .panel { border: 1px solid #999; background: white; display: flex; flex-direction: column; position: relative; padding-top: 10px; }
        #docs-pane { height: 420px; flex-shrink: 0; }
        #project-manager { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #ddd; border-bottom: 1px solid #999; flex-shrink: 0; }
        .tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-size: 0.8em; border-right: 1px solid #ccc; }
        .tab.active { background: white; border-bottom: 2px solid #0078d4; font-weight: bold; }
        .tab-content { flex: 1; display: none; padding: 10px; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }
        textarea { width: 100%; border: 1px solid #ccc; font-family: 'Consolas', monospace; font-size: 13px; padding: 8px; resize: none; flex: 1; }
        #project-list { flex: 1; overflow-y: auto; padding: 10px; background: white; font-size: 0.85em; }
        #hud { position: absolute; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); padding: 12px; border: 1px solid #0078d4; font-family: monospace; font-size: 0.9em; min-width: 220px; pointer-events: none; }
        .hud-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
        .hud-val { font-weight: bold; color: #0078d4; }
        .btn-build { width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; background: #28a745; color: white; border: none; font-weight: bold; }
        .btn-pdf { width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; background: #0078d4; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="design-pane">
        <div class="group-box">
            <span class="label">1. Rakennekuva (SVG)</span>
            <div id="svg-out"></div>
            <div id="hud">
                <div class="hud-row"><span>KORKEUS:</span> <span><span id="h-val" class="hud-val">0</span> mm</span></div>
                <div class="hud-row"><span>U-ARVO:</span> <span><span id="u-val" class="hud-val">0.000</span> W/m²K</span></div>
                <div class="hud-row"><span>PAINO:</span> <span><span id="w-val" class="hud-val">0.0</span> kg/m²</span></div>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div id="docs-pane" class="panel">
            <span class="label">2. Suunnittelu</span>
            <div class="tabs">
                <div id="btn-ai" class="tab active" onclick="setTab('ai')">Määrittely</div>
                <div id="btn-proj" class="tab" onclick="setTab('proj')">Tiedot</div>
            </div>
            
            <div id="ai" class="tab-content active">
                <textarea id="inp" placeholder="esim: betoni 200" oninput="updateView()"></textarea>
                <button class="btn-build" onclick="updateView()">PÄIVITÄ NÄKYMÄ</button>
            </div>
            
            <div id="proj" class="tab-content">
                <div style="font-size: 0.8em; margin-bottom:10px;">
                    Projekti nro: <input id="pid" value="P-101" style="width:100%"><br><br>
                    Detali nro: <input id="did" value="D-01" style="width:100%"><br><br>
                    Rakennetyyppi: 
                    <select id="st-type" style="width:100%" onchange="updateView()">
                        <option value="ulkoseinä">Ulkoseinä (vaaka)</option>
                        <option value="yläpohja">Yläpohja (ylös)</option>
                        <option value="alapohja">Alapohja (alas)</option>
                    </select>
                </div>
                <button class="btn-pdf" onclick="saveAndPDF()">TALLENNA & PDF</button>
            </div>
        </div>

        <div id="project-manager" class="panel">
            <span class="label">3. Projektitiedostot</span>
            <div id="project-list">Ladataan...</div>
            <button onclick="refreshList()" style="margin:5px; font-size:0.7em; cursor:pointer;">Päivitä lista</button>
        </div>
    </div>

    <script>
        function setTab(t) { 
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active')); 
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); 
            document.getElementById('btn-' + t).classList.add('active'); 
            document.getElementById(t).classList.add('active'); 
        }

        async function updateView() {
            const txt = document.getElementById('inp').value;
            const pid = document.getElementById('pid').value;
            const did = document.getElementById('did').value;
            const st = document.getElementById('st-type').value;
            
            try {
                const res = await fetch(`/get-svg?txt=${encodeURIComponent(txt)}&id=${pid}&did=${did}&st=${st}`);
                const data = await res.json();
                document.getElementById('svg-out').innerHTML = data.svg;
                document.getElementById('h-val').innerText = data.h_total;
                document.getElementById('u-val').innerText = data.u_val;
                document.getElementById('w-val').innerText = data.weight;
            } catch(e) { console.error("Error", e); }
        }

        async function saveAndPDF() {
            const txt = document.getElementById('inp').value;
            const pid = document.getElementById('pid').value;
            const did = document.getElementById('did').value;
            await fetch(`/save-pdf?txt=${encodeURIComponent(txt)}&id=${pid}&did=${did}`);
            refreshList();
            alert("Tallennettu!");
        }

        async function loadDetail(pid, did) {
            const res = await fetch(`/load-design?id=${pid}&did=${did}`);
            document.getElementById('inp').value = await res.text();
            document.getElementById('pid').value = pid;
            document.getElementById('did').value = did;
            updateView();
        }

        async function refreshList() {
            const listDiv = document.getElementById('project-list');
            try {
                const res = await fetch('/list-projects');
                const projs = await res.json();
                let html = "";
                projs.forEach(p => {
                    html += `<div style="font-weight:bold; margin-top:10px;">📁 ${p.name}</div>`;
                    p.details.forEach(d => {
                        html += `<div style="margin-left:15px; color:#0078d4; cursor:pointer;" onclick="loadDetail('${p.name}', '${d}')">📄 ${d}</div>`;
                    });
                });
                listDiv.innerHTML = html || "Tyhjä.";
            } catch(e) { listDiv.innerHTML = "Virhe listauksessa."; }
        }

        window.onload = () => { refreshList(); updateView(); };
    </script>
</body>
</html>
